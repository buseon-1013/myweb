<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buseon</title>
<meta name="theme-color" content="#0e0d12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* ===== 색상 (여기서 바꾸면 전체 색이 바뀝니다) ===== */
  :root {
    color-scheme: dark;
    --배경: #0e0d12;       /* 어두운 바탕 */
    --카드: #1a1820;       /* 카드 바탕 */
    --입력배경: #24212c;   /* 입력 칸 바탕 */
    --글씨: #f3f0f8;       /* 밝은 글씨 */
    --연한글씨: #a8a2b4;
    --강조: #9a6bff;       /* 보라 */
    --강조진하게: #8152f0;
    --강조연하게: #2a2140;
    --선: #2f2b38;
    --브랜드: linear-gradient(90deg, #f3d9a4, #c9a7ff);  /* 브랜드: 골드 → 라벤더 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--배경);
    color: var(--글씨);
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 17px;
    line-height: 1.7;
    word-break: keep-all;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 20px 48px; }

  /* ===== 제목 ===== */
  /* ===== 맨 위 브랜드 줄 ===== */
  .브랜드바 {
    position: sticky; top: 0; z-index: 20;
    display: flex; justify-content: center; align-items: center;
    height: 56px;
    background: rgba(14, 13, 18, 0.88);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .브랜드 {
    font-family: "Montserrat", -apple-system, sans-serif;
    font-size: 24px; font-weight: 800; letter-spacing: 0.06em;
    text-decoration: none;
    color: #e2c3d0;                               /* 그라데이션을 못 쓰는 브라우저용 */
    background: var(--브랜드);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 10px rgba(201, 167, 255, 0.35));
  }

  header { text-align: center; padding: 28px 0 24px; }
  header .작은글 { color: var(--강조); font-size: 16px; letter-spacing: 0.15em; margin-bottom: 6px; }
  header h1 { font-size: 38px; font-weight: 800; letter-spacing: 0.04em; }
  header .줄 { width: 48px; height: 3px; background: var(--강조); margin: 18px auto 0; border-radius: 2px; }

  /* ===== 포스터 슬라이드 ===== */
  .섹션제목 { font-size: 18px; font-weight: 800; margin-bottom: 12px; }
  .슬라이드틀 { position: relative; margin: 0 -20px 6px; }
  .슬라이드 {
    display: flex; gap: 12px;
    overflow-x: auto; overscroll-behavior-x: contain;
    scroll-snap-type: x mandatory;
    padding: 4px 20px 18px;
    scroll-padding: 0 20px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .슬라이드::-webkit-scrollbar { display: none; }
  .포스터 {
    position: relative; flex: 0 0 62%; max-width: 240px;
    aspect-ratio: 2 / 3;
    scroll-snap-align: start;
    padding: 0; border: none; border-radius: 18px; overflow: hidden;
    cursor: pointer; font: inherit; text-align: center; color: #fff;
    background: #1d1533;
    box-shadow: 0 10px 24px rgba(40, 20, 80, 0.22);
    transition: transform 0.2s;
  }
  .포스터:hover, .포스터:focus-visible { transform: translateY(-3px); outline: none; }
  .포스터:focus-visible { box-shadow: 0 0 0 3px var(--강조); }
  .포스터 svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .포스터 img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .포스터 .글 { position: absolute; left: 10px; right: 10px; bottom: 7%; }
  .포스터 .연도 { font-family: "Nanum Myeongjo", serif; font-style: italic; font-size: 19px; letter-spacing: 0.08em; opacity: 0.92; }
  .포스터 .큰제목 {
    font-family: "Nanum Myeongjo", serif; font-size: 28px; font-weight: 800;
    letter-spacing: 0.03em; line-height: 1.25;
    text-shadow: 0 0 16px var(--빛, rgba(255,170,210,.75)), 0 2px 6px rgba(0,0,0,.55);
  }
  .포스터 .작은제목 { font-size: 16px; margin-top: 6px; opacity: 0.94; line-height: 1.45; text-shadow: 0 1px 4px rgba(0,0,0,.7); }

  .포스터 .별 { animation: 반짝 3s ease-in-out infinite; }
  .포스터 .별:nth-of-type(2n) { animation-delay: 1.2s; }
  .포스터 .별:nth-of-type(3n) { animation-delay: 2.1s; }
  @keyframes 반짝 { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  .포스터 .둥실 { animation: 둥실 4s ease-in-out infinite; }
  @keyframes 둥실 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .포스터 .떨어짐 { animation: 떨어짐 7s linear infinite; }
  .포스터 .떨어짐:nth-of-type(2n) { animation-duration: 9s; animation-delay: -3s; }
  .포스터 .떨어짐:nth-of-type(3n) { animation-duration: 8s; animation-delay: -5s; }
  @keyframes 떨어짐 { from { transform: translateY(-40px); } to { transform: translateY(440px); } }
  @media (prefers-reduced-motion: reduce) { .포스터 .별, .포스터 .둥실, .포스터 .떨어짐 { animation: none; } }

  /* 아래 점 (몇 번째 슬라이드인지) */
  .점들 { display: flex; justify-content: center; gap: 6px; margin-bottom: 30px; }
  .점들 span { width: 7px; height: 7px; border-radius: 999px; background: var(--선); transition: width 0.2s, background-color 0.2s; }
  .점들 span.지금 { width: 20px; background: var(--강조); }

  /* 컴퓨터에서만 보이는 좌우 화살표 */
  .화살표 {
    display: none; position: absolute; top: 42%; z-index: 2;
    width: 40px; height: 40px; border-radius: 50%;
    border: none; cursor: pointer; font-size: 20px; line-height: 40px;
    background: rgba(255,255,255,.92); color: var(--강조);
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  .화살표.왼쪽 { left: 6px; } .화살표.오른쪽 { right: 6px; }
  @media (hover: hover) and (pointer: fine) { .화살표 { display: block; } }

  /* ===== 첫 화면: 사주 종류 고르기 ===== */
  .고르기안내 { text-align: center; font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .종류목록 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .종류 {
    font: inherit; text-align: left; cursor: pointer;
    background: var(--카드);
    border: 1.5px solid var(--선);
    border-radius: 16px;
    padding: 18px 16px;
    color: var(--글씨);
    transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
  }
  .종류:hover, .종류:focus-visible {
    border-color: var(--강조); outline: none;
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(154, 107, 255, 0.22);
  }
  .종류 .그림 { font-size: 34px; line-height: 1.2; }
  .종류 .이름 { display: block; font-size: 18px; font-weight: 800; margin-top: 6px; }
  .종류 .설명 { display: block; font-size: 16px; color: var(--연한글씨); line-height: 1.5; margin-top: 2px; }

  /* ===== 고른 사주 표시 ===== */
  .고른사주 {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 14px;
  }
  .고른사주 .제목 { font-size: 20px; font-weight: 800; color: var(--강조); }
  .뒤로 {
    font: inherit; font-size: 16px; cursor: pointer;
    background: none; border: none; color: var(--연한글씨);
    padding: 6px 0; text-decoration: underline;
  }
  .뒤로:hover { color: var(--강조); }

  /* ===== 입력 칸 ===== */
  .입력칸 {
    background: var(--카드);
    border: 1px solid var(--선);
    border-radius: 16px;
    padding: 24px 20px;
  }
  .항목 + .항목 { margin-top: 22px; }
  .항목 > .이름 { display: block; font-weight: 700; margin-bottom: 8px; }
  .세칸 { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }

  select {
    width: 100%;
    font: inherit;
    font-size: 17px;
    color: var(--글씨);
    background-color: var(--입력배경);
    border: 1.5px solid var(--선);
    border-radius: 10px;
    padding: 12px 10px;
    appearance: none;
    -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--연한글씨) 50%),
                      linear-gradient(135deg, var(--연한글씨) 50%, transparent 50%);
    background-position: calc(100% - 16px) 52%, calc(100% - 11px) 52%;
    background-size: 5px 5px;
    background-repeat: no-repeat;
  }
  select:focus { outline: none; border-color: var(--강조); }
  select option { background: var(--카드); color: var(--글씨); }

  /* 성별 고르기 */
  .성별 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .성별 input { position: absolute; opacity: 0; pointer-events: none; }
  .성별 label {
    display: block; text-align: center;
    background: var(--입력배경);
    border: 1.5px solid var(--선);
    border-radius: 10px;
    padding: 12px 0;
    font-weight: 700;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s, border-color 0.15s;
  }
  .성별 label:hover { border-color: var(--강조); }
  .성별 input:checked + label { background: var(--강조); border-color: var(--강조); color: #fff; }
  .성별 input:focus-visible + label { outline: 2px solid var(--강조); outline-offset: 2px; }

  .풀이버튼 {
    display: block; width: 100%;
    margin-top: 28px;
    font: inherit; font-size: 19px; font-weight: 800;
    color: #fff; background: var(--강조);
    border: none; border-radius: 12px;
    padding: 17px 0;
    cursor: pointer;
    transition: background-color 0.15s;
  }
  .풀이버튼:hover { background: var(--강조진하게); }

  .알림 { color: #ff8f8f; font-size: 16px; text-align: center; margin-top: 12px; min-height: 1.7em; }

  /* ===== 결과 ===== */
  .결과 { display: none; margin-top: 28px; scroll-margin-top: 72px; }
  .결과.보임 { display: block; }

  .띠카드 {
    text-align: center;
    background: var(--강조);
    color: #fff;
    border-radius: 16px;
    padding: 26px 20px;
  }
  .띠카드 .동물 { font-size: 52px; line-height: 1.2; }
  .띠카드 .띠 { font-size: 26px; font-weight: 800; margin-top: 6px; }
  .띠카드 .십이지 { font-size: 17px; opacity: 0.9; }
  .띠카드 .요약 { font-size: 16px; opacity: 0.85; margin-top: 10px; }

  .결과칸 {
    background: var(--카드);
    border: 1px solid var(--선);
    border-radius: 16px;
    padding: 22px 20px;
    margin-top: 14px;
  }
  .결과칸 h2 { font-size: 20px; color: var(--강조); margin-bottom: 10px; }
  .결과칸 ul { list-style: none; }
  .결과칸 li { position: relative; padding-left: 18px; }
  .결과칸 li + li { margin-top: 8px; }
  .결과칸 li::before {
    content: ""; position: absolute; left: 2px; top: 0.7em;
    width: 7px; height: 7px; border-radius: 50%; background: var(--강조);
  }

  .상담안내 {
    text-align: center;
    background: var(--강조연하게);
    border-radius: 16px;
    padding: 24px 20px;
    margin-top: 14px;
  }
  .상담안내 p { font-size: 18px; font-weight: 700; }
  .상담안내 .설명 { font-size: 16px; font-weight: 400; color: var(--연한글씨); margin-top: 4px; }
  .연결버튼 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }
  .예약버튼, .카톡버튼 {
    display: block;
    text-decoration: none;
    font-size: 18px; font-weight: 800;
    padding: 15px 0;
    border-radius: 12px;
    transition: background-color 0.15s;
  }
  .예약버튼 { background: var(--강조); color: #fff; }
  .예약버튼:hover { background: var(--강조진하게); }
  .카톡버튼 { background: #fee500; color: #191919; }
  .카톡버튼:hover { background: #f2d900; }

  .참고 { font-size: 16px; color: var(--연한글씨); text-align: center; margin-top: 16px; }

  /* ===== 무료 결과 (오행 · 성향 · 맛보기) ===== */
  .풀이글 p + p { margin-top: 10px; }
  .풀이글 strong { color: var(--강조); }
  .기둥표 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 16px; }
  .기둥 {
    text-align: center; background: var(--입력배경); border: 1px solid var(--선); border-radius: 10px;
    padding: 8px 2px; display: flex; flex-direction: column; line-height: 1.35;
  }
  .기둥.나 { border-color: var(--강조); background: var(--강조연하게); }
  .기둥.빈 { opacity: 0.6; }
  .기둥이름 { font-size: 16px; color: var(--연한글씨); }
  .기둥글 { font-size: 22px; font-weight: 800; letter-spacing: 0.06em; }
  .기둥작 { font-size: 16px; color: var(--연한글씨); }
  .오행표 { margin-bottom: 14px; }
  .오행줄 { display: grid; grid-template-columns: 64px 1fr 36px; align-items: center; gap: 8px; }
  .오행줄 + .오행줄 { margin-top: 6px; }
  .오행이름 { font-weight: 800; font-size: 16px; }
  .오행막대 { height: 10px; background: #2c2935; border-radius: 999px; overflow: hidden; }
  .오행막대 span { display: block; height: 100%; border-radius: 999px; min-width: 0; }
  .오행수 { font-size: 16px; text-align: right; color: var(--연한글씨); }
  .작은안내 { font-size: 16px; color: var(--연한글씨); }
  .성향하나 + .성향하나 { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--선); }
  .성향제목 { font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .성향제목 .번호 {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    background: var(--강조); color: #fff; font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .성향하나 .성향제목 + p { margin-top: 4px; }
  .잠금 {
    margin-top: 16px; padding: 16px; border-radius: 12px;
    background: var(--강조연하게); border: 1px dashed var(--강조);
  }
  .잠금제목 { font-weight: 800; color: var(--강조); }
  .잠금 ul { list-style: none; margin-top: 6px; }
  .잠금 li { color: var(--연한글씨); filter: blur(0.4px); }

  /* ===== 카테고리 결과 꾸밈 ===== */
  .타입카드 {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    background: var(--강조연하게); border: 1px solid rgba(154, 107, 255, 0.35);
    border-radius: 14px; padding: 16px 12px; margin-bottom: 14px;
  }
  .타입그림 { font-size: 34px; line-height: 1.2; }
  .타입이름 { font-size: 19px; font-weight: 800; margin-top: 4px; color: var(--글씨); }
  .타입부제 { font-size: 16px; color: var(--연한글씨); margin-top: 2px; }
  .조언 { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,0.04); }
  .한줄요약 {
    margin-top: 14px; padding: 14px; border-radius: 12px; text-align: center;
    background: linear-gradient(90deg, rgba(243,217,164,0.14), rgba(201,167,255,0.18));
    border: 1px solid rgba(201, 167, 255, 0.3);
  }
  .한줄요약 span { display: block; font-size: 16px; color: var(--연한글씨); }
  .한줄요약 strong { display: block; font-size: 18px; color: #f3d9a4; margin-top: 2px; }
  .포인트목록 { padding-left: 1.4em; }
  .포인트목록 li + li { margin-top: 10px; }
  .포인트목록 li strong { display: block; color: var(--강조); }
  .결과칸 .포인트목록 li, .결과칸 .상대목록 li, .결과칸 .방향목록 li { padding-left: 0; }
  .결과칸 .포인트목록 li::before, .결과칸 .상대목록 li::before, .결과칸 .방향목록 li::before { display: none; }
  .결과칸 .포인트목록 { list-style: decimal; }
  .미터 {
    display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 12px; font-size: 18px;
  }
  .미터라벨 { color: var(--연한글씨); font-size: 16px; }
  .미터값 { letter-spacing: 2px; }
  .미터숫자 { font-weight: 800; color: var(--강조); }
  .상대목록 { margin: 12px 0; }
  .상대목록 li { display: grid; grid-template-columns: 84px 1fr; gap: 8px; padding: 8px 0 !important; border-bottom: 1px dashed var(--선); }
  .상대목록 li span { color: var(--강조); font-weight: 700; }
  .능력치 { margin-bottom: 8px; }
  .능력줄 { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .능력이름 { font-weight: 800; font-size: 18px; }
  .능력별 { color: #f3d9a4; font-size: 20px; letter-spacing: 2px; }
  .능력이유 { color: var(--연한글씨); font-size: 16px; }
  .방향목록 { margin: 10px 0; }
  .방향목록 li + li { margin-top: 8px; }

  /* ===== 맨 아래 안내 ===== */
  .맨아래 {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 20px 32px;
    border-top: 1px solid var(--선);
    font-size: 16px;
    line-height: 1.6;
    color: #7d7788;
    text-align: center;
  }
</style>
</head>
<body>

<!-- 맨 위 브랜드 이름 -->
<div class="브랜드바"><a class="브랜드" href="./">Buseon</a></div>

<div class="wrap">


  <!-- ===== 첫 화면: 사주 종류 고르기 ===== -->
  <section id="선택화면">

    <!-- 포스터 슬라이드 (옆으로 밀어서 넘기기) -->
    <p class="섹션제목">지금 많이 보는 사주 ✨</p>
    <div class="슬라이드틀">
      <button type="button" class="화살표 왼쪽" id="왼쪽" aria-label="이전">‹</button>

        재성: ["새로운 기회 · 수입", "돈의 흐름이 활발해지는 해예요. 기회가 늘어나는 만큼 고르는 눈이 중요해서, 무엇을 잡고 무엇을 흘려보낼지 기준이 필요해요."],
        관성: ["재정 관리 · 안정적인 수입", "수입이 구조를 갖추기 좋은 해예요. 큰 한 방보다 고정 수입과 지출 구조를 다듬을수록 재물이 단단해지기 쉬워요."],
        인성: ["자기계발 · 문서와 계약", "당장의 수익보다 공부와 준비가 나중의 재물로 이어지기 쉬운 해예요. 계약서, 보험, 부동산 서류처럼 문서를 꼼꼼히 챙기면 좋아요."]
      };
      var a = 초점[f.세운천간];
      글.push(해이름(f, "의") + " 천간은 일간 " + f.일간글 + "에게 " + 이에요(세운.천간십성) + ". 올해 특히 중요하게 볼 부분은 <strong>" + a[0] + "</strong>" + (받침(a[0]) ? "이에요." : "예요."));
      글.push(a[1]);
      if (f.세운지지 !== f.세운천간) 글.push("지지로는 " + 세운.지지십성 + "의 기운이 함께 들어와, '" + 초점[f.세운지지][0] + "'도 하반기로 갈수록 눈여겨볼 부분이에요.");
      var 재물별 = f.세운천간 === "재성" || f.세운지지 === "재성";
      if (재물별) 글.push(f.강약 === "신약"
        ? "재물의 별이 들어오지만 신약한 사주라, 기회가 커 보여도 내가 감당할 수 있는 크기인지 먼저 따져 보는 게 좋아요."
        : "재물의 별이 들어오고 일간의 힘도 받쳐 주는 편이라, 준비된 기회를 잡기에 유리한 흐름으로 볼 수 있어요.");
      else 글.push("올해는 재물의 별이 직접 들어오는 해는 아니라, 수입을 크게 늘리기보다 '새는 돈을 막고 기반을 다지는 해'로 쓰면 다음 흐름에서 힘이 될 수 있어요.");
      return [
        { 제목: "① 나는 돈을 어떻게 다루는 사람?", 본문: 결과1 },
        { 제목: "② 내 돈 새는 구멍", 본문: 결과2 },
        { 제목: "③ " + 세운.연도 + " 돈의 흐름", 본문: 문단(글) + 잠금(["재물 흐름이 좋아지기 쉬운 달", "나에게 맞는 재테크 방식", "큰돈이 움직이기 쉬운 시기"]) }
      ];
    }

    var 만드는법 = { some: 썸결과, love: 연애결과, marriage: 결혼결과, reunion: 재회결과, career: 직업결과, money: 재물결과 };
    function 만들기(사주, 종류id) { return 만드는법[종류id](특징(사주)); }
    return { 만들기: 만들기 };
  })();

  /* ===== 풀이 보기 ===== */
  function 목록넣기(id, 줄들) {
    var ul = document.getElementById(id);
    ul.innerHTML = "";
    줄들.forEach(function (글) {
      var li = document.createElement("li");
      li.textContent = 글;
      ul.appendChild(li);
    });
  }

  document.getElementById("풀이버튼").addEventListener("click", function () {
    var 알림 = document.getElementById("알림");
    var 시간 = document.getElementById("시간").value;
    var 성별 = document.querySelector('input[name="성별"]:checked');

    if (!연칸.value || !월칸.value || !일칸.value) { 알림.textContent = "생년월일을 모두 골라 주세요."; return; }
    if (!시간) { 알림.textContent = "태어난 시간을 골라 주세요. 모르시면 '모름'을 고르세요."; return; }
    if (!성별) { 알림.textContent = "성별을 골라 주세요."; return; }
    알림.textContent = "";

    var 연도 = Number(연칸.value);
    // 사주 여덟 글자 계산
    var 사주 = 사주계산.계산({
      연: 연도, 월: Number(월칸.value), 일: Number(일칸.value),
      시진: 시간, 성별: 성별.value, 기준연도: 올해
    });
    var 정보 = 띠목록[사주.띠번호];   // 띠는 입춘 기준 년주로 정합니다
    var 해이름 = 사주.기둥.년.글 + "년";

    document.getElementById("동물").textContent = 정보.그림;
    document.getElementById("띠").textContent = 정보.띠;
    document.getElementById("십이지").textContent = "내 사주: " + [사주.기둥.년, 사주.기둥.월, 사주.기둥.일, 사주.기둥.시]
      .filter(Boolean).map(function (p) { return p.한자; }).join(" ") + " · " + 해이름 + "생";
    document.getElementById("요약").textContent =
      연도 + "년 " + 월칸.value + "월 " + 일칸.value + "일 · " +
      (시간 === "모름" ? "시간 모름" : 시간) + " · " + 성별.value;

    // 카테고리별 무료 결과 3개
    var 결과들 = 무료풀이.만들기(사주, 고른종류.id);
    결과들.forEach(function (r, i) {
      document.getElementById("결과제목" + (i + 1)).textContent = r.제목;
      document.getElementById("결과본문" + (i + 1)).innerHTML = r.본문;
    });

    var 결과 = document.getElementById("결과");
    결과.classList.add("보임");
    결과.scrollIntoView({ behavior: "smooth" });
  });
</script>
