<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>요금 | 운세 상담소</title>
<style>
  /* ===== 색상 (여기서 바꾸면 전체 색이 바뀝니다) ===== */
  :root {
    --배경: #f5ede0;
    --카드: #fbf7f0;
    --글씨: #4a2e1f;
    --연한글씨: #7a5c48;
    --강조: #7b2d5f;
    --강조진하게: #5e1f48;
    --선: #e2d4c0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--배경); color: var(--글씨);
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 17px; line-height: 1.7;
    padding-bottom: 96px; word-break: keep-all;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 20px; }

  /* ===== 위쪽 이동 메뉴 ===== */
  .위메뉴 { position: sticky; top: 0; z-index: 10; background: var(--배경); border-bottom: 1px solid var(--선); }
  .위메뉴 ul { max-width: 640px; margin: 0 auto; display: flex; list-style: none; }
  .위메뉴 li { flex: 1; }
  .위메뉴 a {
    display: block; text-align: center; padding: 14px 0 12px;
    font-size: 17px; font-weight: 700; color: var(--연한글씨); text-decoration: none;
    border-bottom: 3px solid transparent; transition: color 0.15s;
  }
  .위메뉴 a:hover { color: var(--강조); }
  .위메뉴 a.지금 { color: var(--강조); border-bottom-color: var(--강조); }

  /* ===== 페이지 제목 ===== */
  header { text-align: center; padding: 40px 0 24px; }
  header h1 { font-size: 30px; font-weight: 800; }
  header .줄 { width: 48px; height: 3px; background: var(--강조); margin: 16px auto 0; border-radius: 2px; }

  /* ===== 내용 칸 ===== */
  .칸 {
    background: var(--카드); border: 1px solid var(--선); border-radius: 14px;
    padding: 22px 20px; margin-bottom: 16px;
  }
  .칸 h2 { font-size: 20px; color: var(--강조); margin-bottom: 8px; }
  .칸 p + p { margin-top: 8px; }
  .칸 ul { padding-left: 1.2em; }
  .칸 li + li { margin-top: 4px; }

  /* ===== 요금표 ===== */
  .요금 { list-style: none; }
  .요금 li {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 12px 0; border-bottom: 1px dashed var(--선);
  }
  .요금 li:last-child { border-bottom: none; }
  .요금 .값 { font-weight: 800; color: var(--강조); white-space: nowrap; margin-left: 12px; }
  .알림 { font-size: 15px; color: var(--연한글씨); text-align: center; margin-top: 8px; }

  /* ===== 연락처 ===== */
  footer { margin-top: 32px; border-top: 1px solid var(--선); padding: 28px 0 20px; text-align: center; }
  footer h2 { font-size: 18px; margin-bottom: 10px; }
  footer .번호 { font-size: 22px; font-weight: 800; color: var(--강조); text-decoration: none; }
  footer .시간 { color: var(--연한글씨); margin-top: 4px; }

  /* ===== 아래 고정 버튼 ===== */
  .고정버튼 {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--배경); border-top: 1px solid var(--선);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    display: flex; gap: 10px; justify-content: center;
  }
  .고정버튼 a {
    flex: 1; max-width: 300px; text-align: center; text-decoration: none;
    font-size: 18px; font-weight: 700; padding: 15px 0; border-radius: 12px;
    transition: background-color 0.15s;
  }
  .전화 { background: var(--강조); color: #fff; }
  .전화:hover { background: var(--강조진하게); }
  .예약 { background: var(--카드); color: var(--강조); border: 2px solid var(--강조); }
  .예약:hover { background: #f1e3ea; }
</style>
</head>
<body>

<!-- 위쪽 이동 메뉴 -->
<nav class="위메뉴">
  <ul>
    <li><a href="index.html">홈</a></li>
    <li><a href="about.html">소개</a></li>
    <li><a href="price.html" class="지금">요금</a></li>
  </ul>
</nav>

<div class="wrap">

  <header>
    <h1>상담 요금</h1>
    <div class="줄"></div>
  </header>

  <!-- 아래 금액은 모두 예시입니다. 실제 금액으로 바꿔 주세요. -->
  <section class="칸">
    <h2>사주 풀이</h2>
    <ul class="요금">
      <li><span>기본 사주 풀이</span><span class="값">50,000원</span></li>
      <li><span>올해 운세 (신년운)</span><span class="값">30,000원</span></li>
    </ul>
  </section>

  <section class="칸">
    <h2>궁합 보기</h2>
    <ul class="요금">
      <li><span>연인 · 부부 궁합</span><span class="값">60,000원</span></li>
      <li><span>가족 궁합 (1명 추가마다)</span><span class="값">20,000원</span></li>
    </ul>
  </section>

  <section class="칸">
    <h2>작명 서비스</h2>
    <ul class="요금">
      <li><span>아기 이름</span><span class="값">200,000원</span></li>
      <li><span>개명</span><span class="값">250,000원</span></li>
      <li><span>가게 · 회사 이름</span><span class="값">300,000원</span></li>
    </ul>
  </section>

  <p class="알림">자세한 내용은 전화로 편하게 물어보세요.</p>

  <footer>
    <h2>연락처</h2>
    <a class="번호" href="tel:01000000000">010-0000-0000</a>
    <p class="시간">평일 10시 ~ 19시</p>
  </footer>

</div>

<!-- 화면 아래에 항상 보이는 버튼 -->
<div class="고정버튼">
  <a class="전화" href="tel:01000000000">📞 전화하기</a>
  <a class="예약" href="index.html#안내칸">예약 문의</a>
</div>

</body>
</html>
